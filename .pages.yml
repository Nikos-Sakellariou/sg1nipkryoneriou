media:
  - name: images
    label: Εικόνες
    input: dist/assets
    output: /assets
    rename: safe
    categories: [image]
  - name: documents
    label: Έγγραφα
    input: dist/documents
    output: /documents
    rename: safe
    categories: [document, spreadsheet]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: προσθήκη {path}"
      update: "content: ενημέρωση {path}"
      delete: "content: διαγραφή {path}"
      rename: "content: μετονομασία {oldPath} σε {newPath}"

content:
  - name: site
    label: Κείμενα ιστοσελίδας
    type: file
    path: dist/content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: site_name
        label: Πλήρης τίτλος Συλλόγου
        type: string
        required: true
      - name: school_name
        label: Όνομα σχολείου
        type: string
        required: true
      - name: phone
        label: Τηλέφωνο
        type: string
        required: true
      - name: email
        label: Email σχολείου
        type: string
        required: true
      - name: association_email
        label: Email Συλλόγου
        type: string
        required: true
      - name: address
        label: Διεύθυνση
        type: text
        required: true
      - name: hero_title
        label: Κεντρικός τίτλος
        type: string
        required: true
      - name: hero_text
        label: Κεντρικό κείμενο
        type: text
        required: true
      - name: hero_image
        label: Κεντρική εικόνα
        type: image
        options:
          media: images
      - name: school_title
        label: Τίτλος ενότητας σχολείου
        type: string
        required: true
      - name: school_text
        label: Κείμενο σχολείου
        type: text
        required: true
      - name: people_title
        label: Τίτλος κοινότητας
        type: string
        required: true
      - name: people_lead
        label: Υπότιτλος κοινότητας
        type: string
        required: true
      - name: teachers_text
        label: Κείμενο εκπαιδευτικών
        type: text
        required: true
      - name: families_text
        label: Κείμενο οικογενειών
        type: text
        required: true
      - name: association_title
        label: Τίτλος Συλλόγου
        type: string
        required: true
      - name: association_intro
        label: Εισαγωγή Συλλόγου
        type: text
        required: true
      - name: board_members
        label: Μέλη Διοικητικού Συμβουλίου
        type: string
        list: true
        description: "Κάθε μέλος σε ξεχωριστή γραμμή, π.χ. Πρόεδρος — Ονοματεπώνυμο"
      - name: association_note
        label: Σημείωση Συλλόγου
        type: text
      - name: goals
        label: Στόχοι και δράσεις
        type: string
        list: true
      - name: news_title
        label: Τίτλος ανακοινώσεων
        type: string
        required: true
      - name: news_lead
        label: Υπότιτλος ανακοινώσεων
        type: string
        required: true
      - name: contact_title
        label: Τίτλος επικοινωνίας
        type: string
        required: true
      - name: contact_text
        label: Κείμενο επικοινωνίας
        type: text
        required: true
      - name: copyright
        label: Copyright
        type: string
        required: true

  - name: announcements
    label: Ανακοινώσεις
    type: file
    path: dist/content/announcements.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: Σύντομο όνομα συνδέσμου
        type: string
        required: true
        description: "Μόνο λατινικά πεζά γράμματα, αριθμοί και παύλες (π.χ. geniki-synelefsi)"
        pattern: "^[a-z0-9-]+$"
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: date
        label: Ημερομηνία
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Σύντομο κείμενο
        type: text
        required: true
        options:
          maxlength: 320
      - name: image
        label: Φωτογραφία (προαιρετική)
        type: image
        options:
          media: images
        description: "Μην ανεβάζετε αναγνωρίσιμες φωτογραφίες παιδιών. Αν εμφανίζεται παιδί, το πρόσωπο πρέπει να είναι καλυμμένο ή μη αναγνωρίσιμο."
      - name: image_alt
        label: Περιγραφή φωτογραφίας
        type: string
        description: "Σύντομη περιγραφή για επισκέπτες που χρησιμοποιούν αναγνώστη οθόνης"
      - name: content
        label: Πλήρες περιεχόμενο
        type: rich-text
        required: true
        options:
          format: html
      - name: label
        label: Ετικέτα
        type: string
      - name: published
        label: Δημοσιευμένη
        type: boolean
        required: true

  - name: activities
    label: Δράσεις
    type: file
    path: dist/content/activities.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: Σύντομο όνομα συνδέσμου
        type: string
        required: true
        description: "Μόνο λατινικά πεζά γράμματα, αριθμοί και παύλες (π.χ. giorti-anoixis)"
        pattern: "^[a-z0-9-]+$"
      - name: title
        label: Τίτλος
        type: string
        required: true
      - name: date
        label: Ημερομηνία
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Σύντομο κείμενο
        type: text
        required: true
        options:
          maxlength: 320
      - name: image
        label: Φωτογραφία
        type: image
        required: true
        options:
          media: images
        description: "Μην ανεβάζετε αναγνωρίσιμες φωτογραφίες παιδιών. Επιλέξτε κατασκευές, χώρους ή ομαδικές λήψεις με καλυμμένα/μη αναγνωρίσιμα πρόσωπα."
      - name: image_alt
        label: Περιγραφή φωτογραφίας
        type: string
        required: true
        description: "Σύντομη περιγραφή για επισκέπτες που χρησιμοποιούν αναγνώστη οθόνης"
      - name: content
        label: Πλήρες περιεχόμενο
        type: rich-text
        required: true
        options:
          format: html
      - name: label
        label: Ετικέτα
        type: string
      - name: published
        label: Δημοσιευμένη
        type: boolean
        required: true

  - name: documents
    label: Χρήσιμα έγγραφα
    type: file
    path: dist/content/documents.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Τίτλος εγγράφου
        type: string
        required: true
      - name: description
        label: Σύντομη περιγραφή
        type: text
        options:
          maxlength: 320
      - name: date
        label: Ημερομηνία
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Κατηγορία
        type: string
        description: "Π.χ. Έντυπο, Οδηγός, Πρακτικό, Κανονισμός"
      - name: file
        label: Αρχείο
        type: file
        required: true
        description: "Ανεβάστε PDF ή αρχείο Word, Excel ή PowerPoint. Μην ανεβάζετε αρχεία με προσωπικά δεδομένα παιδιών."
        options:
          media: documents
          extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx, odt, ods]
          categories: [document, spreadsheet]
          rename: safe
      - name: published
        label: Δημοσιευμένο
        type: boolean
        required: true

